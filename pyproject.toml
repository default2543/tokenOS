[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenos"
version = "0.1.0"
description = "Adaptive context management experiments for coding agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "azure-identity==1.25.3",
  "httpx==0.28.1",
  "openai==2.47.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
tokenos = "tokenos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "docker: requires a running Docker daemon and the TokenOS evaluator image",
  "azure: makes a live Azure OpenAI request",
]
